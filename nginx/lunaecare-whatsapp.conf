# ==============================================================================
# Configuração do Nginx para Lunae Care WhatsApp Backend
# VPS Hostinger Ubuntu (Reverse Proxy com SSL Let's Encrypt)
#
# Caminho de instalação recomendado no Ubuntu:
#   /etc/nginx/sites-available/lunaecare-whatsapp.conf
#   ln -s /etc/nginx/sites-available/lunaecare-whatsapp.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Zona de limitação de requisições por IP para proteção contra DDoS/Abuso na borda
limit_req_zone $binary_remote_addr zone=lunae_api_limit:10m rate=40r/s;
limit_req_status 429;

upstream lunaecare_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirecionamento HTTP (Porta 80) -> HTTPS (Porta 443)
server {
    listen 80;
    listen [::]:80;
    server_name api-whatsapp.seudominio.com.br;

    # Validação do Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Seguro HTTPS (Porta 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-whatsapp.seudominio.com.br;

    # Certificados SSL gerenciados pelo Certbot (ajuste para o seu domínio)
    ssl_certificate /etc/letsencrypt/live/api-whatsapp.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-whatsapp.seudominio.com.br/privkey.pem;

    # Configurações modernas de segurança TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamanho máximo de upload para anexos médicos, áudios e PDFs de WhatsApp
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain application/xml text/css application/javascript;

    # Logs customizados
    access_log /var/log/nginx/lunaecare_whatsapp_access.log;
    error_log /var/log/nginx/lunaecare_whatsapp_error.log warn;

    # Healthcheck sem rate-limiting (usado por monitores externos e UptimeRobot)
    location = /api/v1/health {
        proxy_pass http://lunaecare_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso para o FastAPI
    location / {
        limit_req zone=lunae_api_limit burst=20 nodelay;

        proxy_pass http://lunaecare_backend;
        proxy_http_version 1.1;

        # Suporte a WebSockets / Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeçalhos de repasse
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts estendidos para operações de pareamento e conexões
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Otimizações de buffer
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
